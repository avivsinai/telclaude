version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # The browser connect protocol needs the same major.minor on both sides:
      # Node playwright-core here and Python playwright in docker/Dockerfile.browser
      # (bounded by what Camoufox supports). Bump them together by hand.
      - dependency-name: "playwright-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
